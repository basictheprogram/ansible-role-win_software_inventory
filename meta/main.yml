---
dependencies: []

galaxy_info:
  role_name: win_software_inventory
  author: "Bob Tanner"
  namespace: realtime
  company: "Real Time Enterprises, Inc."
  description: >
    Collects the list of installed software (name, version, publisher, install
    date) from Windows endpoints via the registry Uninstall keys and writes a
    structured JSON file per host into a local git working copy on the Ansible
    control node, committing and pushing once per play run for a versioned
    history of fleet-wide software changes over time. Targets Windows 10,
    Windows 11, and Windows Server (2016, 2019, 2022, 2025). Requires WinRM on
    all managed hosts.
  issue_tracker_url: "https://gitlab.real-time.com/ansible-roles/win-software-inventory/-/issues"
  license: "MIT"
  min_ansible_version: "2.20"

  galaxy_tags:
    - windows
    - inventory
    - software
    - registry
    - powershell
    - winrm
    - git
    - assetmanagement
